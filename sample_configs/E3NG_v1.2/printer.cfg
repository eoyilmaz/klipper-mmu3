[respond]
[include chopper_tune.cfg]
[include mainsail.cfg]
[include mmu3-12x-ng.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_350042001851313238353730-if00

[mcu ebb]
# serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_3B0037001250564137393520-if00  # ebb36
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_50004C000450534D34323120-if00  # ebb42

# [mcu rpi]
# serial: /tmp/klipper_host_mcu

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340410545C1C-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 20
max_z_accel: 200

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# Required for MMU3's lifetime operation statistics (MMU_STATS, and the
# total_stats field in the MMU3 status object) to persist across restarts.
[save_variables]
filename: /home/pi/printer_data/config/mmu3_variables.cfg

# This file contains common pin mappings for the BigTreeTech SKR 3.
# This board can ship with one of two chips, STM32H743 or STM32H723.
# To use this config, during "make menuconfig" enable "low-level
# options", "STM32H743" or "STM32H723", "128KiB bootloader",
# and "25MHz clock".

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 64 # 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x: virtual_endstop # ^PC1
position_endstop: 0
position_max: 235
homing_speed: 30
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PD5
#run_current: 1.100
diag_pin: PC1
stealthchop_threshold: 0 # 999999
driver_sgthrs: 38
interpolate: True

[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
microsteps: 64 # 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y: virtual_endstop # ^PC3
position_endstop: 0
position_min: 0
position_max: 248.5
homing_speed: 50  # 30
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD0
diag_pin: PC3
# run_current: 1.100
stealthchop_threshold: 0 # 999999
driver_sgthrs: 44
interpolate: True

[stepper_z]
step_pin: PE2
dir_pin: PE3
enable_pin: !PE0
microsteps: 16
rotation_distance: 4
# gear_ratio: 40:20
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 242
homing_speed: 15

[tmc2209 stepper_z]
uart_pin: PE1
#run_current: 0.400
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PD11
dir_pin: PD10
enable_pin: !PD13
microsteps: 16
rotation_distance: 4
# gear_ratio: 40:20
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z1]
uart_pin: PD12
#run_current: 0.400
stealthchop_threshold: 999999

[stepper_z2]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 4
# gear_ratio: 40:20
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z2]
uart_pin: PC6
#run_current: 0.400
stealthchop_threshold: 999999

[extruder]
step_pin: ebb:PD3  # ebb:PB14
dir_pin: !ebb:PD2  # ebb:PA8
enable_pin: !ebb:PB6
microsteps: 16
gear_ratio: 42:12
rotation_distance: 25.70 # 23.06725347 # 23.015
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb:PB0  # ebb:PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: ebb:PA1 # ebb:PA3
pullup_resistor: 2200
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
# min_extrude_temp: 10
min_temp: 0
max_temp: 300
pressure_advance: 0.044 # 0.048
max_extrude_only_velocity: 100
max_extrude_cross_section: 10.0
max_extrude_only_accel: 5000
max_extrude_only_distance: 1000.0

[tmc2209 extruder]
uart_pin: ebb:PB3
run_current: 0.650

[heater_bed]
heater_pin: PD7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 110

[fan]
pin: ebb:PB8  # ebb:PD3

[heater_fan fan1]
pin: ebb:PB15  # ebb:PA5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[probe_eddy_current btt_eddy_probe]
sensor_type: ldc1612
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 0
y_offset: 22.245
tap_z_offset: 0

[temperature_probe btt_eddy_probe]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
calibration_position: 117.5, 95.2, 0
calibration_extruder_temp: 130
calibration_bed_temp: 65
max_validation_temp: 65

# [safe_z_home]
# # home_xy_position: 147.5, 142.5
# # home_xy_position: 32, 230
# home_xy_position: 117.5, 95.2
# z_hop: 2
# z_hop_speed: 15.0

[force_move]
enable_force_move: true

[homing_override]
axes: xyz
gcode:
  # 1. Safety Z-hop
  # Lifts the head 10mm. If Z isn't homed, it forces a "fake" position first.
  SET_KINEMATIC_POSITION Z=0
  G1 Z2 F600

  # Determine if we are doing a full G28 or just specific axes
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # 2. Home X First
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}

  # 3. Home Y Second
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}

  # 4. Home X Again
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}

  # 5. Home Z Last
  {% if home_all or 'Z' in params %}
    G1 X117.5 Y95.2 F6000
    G28 Z
    G1 Z5 # Lift Z after homing to avoid dragging the nozzle
  {% endif %}

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 10, 24.30
mesh_max: 220, 225 # 215, 225  # 205, 225
probe_count: 21, 21
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
adaptive_margin: 5
scan_overshoot: 10

[screws_tilt_adjust]
screw1_name: front left screw
screw1: 29,16

screw2_name: front right screw
screw2: 200,16

screw3_name: rear right screw
screw3: 200,178.70

screw4_name: rear left screw
screw4: 29,178.70

horizontal_move_z: 10
speed: 200
screw_thread: CW-M4

[z_tilt]
z_positions: -28.00, 7
             256.50, 7
             117.5, 285

points: 29,16  # same with screw1
        200,16  # same with screw2
        # 195,158 # same with screw3
        # 24,158  # same with screw4
        117.5,178.70  # middle of screw3 and screw4

speed: 200
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.02

[input_shaper]
# 2026-02-22 - E3NG v1.2 & Sprite Extruder Upgrade
# shaper_freq_x: 57.8
# shaper_type_x: mzv
# shaper_freq_y: 52.4
# shaper_type_y: 2hump_ei
# 2026-09-14 - New toolhead design, with BTT SFS Sensor closer to the print head
# shaper_freq_x: 87.8
# shaper_type_x: 3hump_ei
# shaper_freq_y: 58.8
# shaper_type_y: 3hump_ei
# 2026-09-20 - New toolhead design, with EBB42 and BTT SFS Sensor still closer to the print head
shaper_freq_x: 96.2
shaper_type_x: 3hump_ei
shaper_freq_y: 47.0
shaper_type_y: mzv

[gcode_macro _IDLE_TIMEOUT]
gcode:
    {% if printer.print_stats.state == "paused" %}
      RESPOND TYPE=echo MSG="No operations in 1 hour!"
    {% else %}
      M84
      TURN_OFF_HEATERS
    {% endif %}

[idle_timeout]
gcode: _IDLE_TIMEOUT
timeout: 3600

[filament_switch_sensor my_filament_sensor]
switch_pin: !ebb:PA3  # !ebb:PA15
pause_on_runout: False
runout_gcode:
  G90  # set to absolute positioning
  SET_IDLE_TIMEOUT TIMEOUT=86400
  M300
  PAUSE
  M117 Filament switch runout
  M118 Filament switch runout

[filament_motion_sensor encoder_sensor]
switch_pin: ^PA0
# event_delay: 3.0  # ignore new events for this amount of time after and event is triggered, default i 3.0
detection_length: 6.00 # accuracy of motion sensor 2.88mm
extruder: extruder
pause_on_runout: False
runout_gcode:
  G90  # set to absolute positioning
  SET_IDLE_TIMEOUT TIMEOUT=86400
  M300
  PAUSE
  M117 Filament encoder runout
  M118 Filament encoder runout
insert_gcode:
  M117 Filament encoder inserted
  M118 Filament encoder inserted

[temperature_fan ebb_fan]
pin: ebb:PB4  # ebb:PD2
sensor_type: Generic 3950
sensor_pin: ebb:PA0
pullup_resistor: 2200
kick_start_time: 0.5
max_power: 1.0
min_speed: 0.0
max_speed: 1.0
# Temperature Targets
target_temp: 40.0             ; The fan will modulate speed to maintain this temp (in Celsius)
min_temp: 0
max_temp: 90
# Control Strategy
control: watermark            ; Simple on/off hysteresis control.
                              ; If you want smoother control, you can switch to PID later.

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

# [temperature_sensor btt_eddy]
# sensor_type: Generic 3950
# sensor_pin: eddy:gpio26

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_fan MCU_fan]
pin: PB6
kick_start_time: 0.5
max_power: 1.0
min_temp: 0
max_temp: 90
hardware_pwm: true
target_temp: 40
sensor_type: temperature_mcu
max_speed: 1.0
min_speed: 0.0
control: pid
pid_Kp: 2.0     ;40
pid_Ki: 5.0     ;0.2
pid_Kd: 0.5     ;0.1
pid_deriv_time: 2.0
#control: watermark # use this control if pid control does not work for your fan

# Defined as an LED for ease of control
[neopixel toolhead_led]
pin: ebb:PB14  # ebb:PC7
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[output_pin main_led]
pin: mmboard:PC6
pwm: True
value: 1
cycle_time: 0.010

# MG90S micro servo driving the purge-catch platform arm used in
# change_filament.gcode. Pulse width range below is the common MG90S
# default (0deg=500us, 180deg=2400us) - verify with a few manual
# SET_SERVO ANGLE= tests that the arm reaches both ends without
# stalling/binding against its mechanical stops before trusting it
# in the macro, and adjust minimum_pulse_width/maximum_pulse_width
# if it over- or under-travels.
[servo purge_platform]
pin: PE5
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0024
initial_angle: 0

[skew_correction]

[exclude_object]

[gcode_arcs]

# [adxl345]
# cs_pin: rpi:None

[lis2dw]
cs_pin: ebb:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw
probe_points: 117.5, 117.5, 20

