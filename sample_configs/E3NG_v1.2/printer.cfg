# disable requiring homing after steppers are disabled
[gcode_macro M84]
rename_existing: M984
gcode:
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_z1 ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_z2 ENABLE=0

[gcode_macro M18]
rename_existing: M918
gcode:
  M84

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 214.0 ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 248.0 ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
gcode:

[gcode_macro TAP_Z_CALIBRATE]
gcode:
    PROBE METHOD=tap SAMPLES=3 SAMPLE_RETRACT_DIST=4 ; average 3 taps; this eddy sensor needs the full 4mm lift-off to reliably detect each tap
    M400
    _APPLY_TAP_Z_CORRECTION

; Manual tap_threshold calibration (docs/Eddy_Probe.md "Tap calibration").
; Run these one at a time from the console, NOT from print start gcode -
; each step needs the operator watching and ready to hit the emergency
; stop (M112) if the nozzle doesn't halt on bed contact. Before each step,
; home the printer and position the nozzle 3-10mm above the bed center.
[gcode_macro TAP_THRESHOLD_CALIBRATE_GUESS]
description: Step 1/3: coarse tap_threshold guess from the main probe calibration data. Be ready to hit the emergency stop (M112).
gcode:
    RESPOND MSG="Make sure the nozzle is homed, centered, and 3-10mm above a clean bed. Be ready to hit the emergency stop (M112)."
    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=guess

[gcode_macro TAP_THRESHOLD_CALIBRATE_REFINE]
description: Step 2/3: refine tap_threshold using the previous successful tap. Be ready to hit the emergency stop (M112).
gcode:
    RESPOND MSG="Make sure the nozzle is homed, centered, and 3-10mm above a clean bed. Be ready to hit the emergency stop (M112)."
    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=refine

[gcode_macro TAP_THRESHOLD_CALIBRATE_VERIFY]
description: Step 3/3: verify the refined tap_threshold over 5 consecutive taps. Be ready to hit the emergency stop (M112).
gcode:
    RESPOND MSG="Make sure the nozzle is homed, centered, and 3-10mm above a clean bed. Be ready to hit the emergency stop (M112)."
    PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=verify

; Kept separate from TAP_Z_CALIBRATE: a gcode_macro's entire template is
; rendered up front, before any of its own lines (like PROBE) have run, so
; reading printer.probe.last_probe_position in the same macro as the PROBE
; call would see stale/default state instead of this tap's result.
[gcode_macro _APPLY_TAP_Z_CORRECTION]
variable_max_correction: 1.0 ; abort instead of applying a correction larger than this many mm
gcode:
    {% set drift = printer.probe.last_probe_position.z %}
    {% if drift | abs > max_correction %}
        { action_raise_error("TAP_Z_CALIBRATE: measured Z drift of %.3fmm exceeds the %.3fmm safety limit - aborting instead of risking a crash. Check tap_threshold/tap_z_offset calibration and Z homing." % (drift, max_correction)) }
    {% else %}
        RESPOND MSG={"'TAP_Z_CALIBRATE: applying Z correction of %.3fmm' " % (drift,)}
        {% set z_now = printer.toolhead.position.z %}
        SET_KINEMATIC_POSITION Z={z_now - drift}
    {% endif %}

; Swings the purge platform under the nozzle to catch ooze during a flush
; pass. There is no dwell for the arm to reach its position, a G4 would
; stall the print when called mid-print.
[gcode_macro PURGE_PLATFORM_EXTEND]
gcode:
  SET_SERVO SERVO=purge_platform ANGLE=0
  UPDATE_DELAYED_GCODE ID=_PURGE_PLATFORM_SERVO_OFF DURATION=2

; Retracts the purge platform back into its wall structure, so the
; accumulated blob catches on the wall and breaks off. Called before
; WIPE_NOZZLE so the platform is clear of the wipe path.
[gcode_macro PURGE_PLATFORM_RETRACT]
gcode:
  SET_SERVO SERVO=purge_platform ANGLE=180
  UPDATE_DELAYED_GCODE ID=_PURGE_PLATFORM_SERVO_OFF DURATION=2

; Switches the servo signal off 2s after PURGE_PLATFORM_EXTEND /
; PURGE_PLATFORM_RETRACT, once the arm has reached its position, without
; blocking the gcode queue. The platform stays in place without holding
; torque. If a blob jams the platform, the MG90S would otherwise keep
; pushing at stall torque, overheating the motor and wearing its gears.
; Each macro call restarts the timer, so a following move is not cut short.
; When testing the macros by hand, leave a gap between them: two SET_SERVO
; commands at the same print time override each other, so only the last
; one moves the arm.
[delayed_gcode _PURGE_PLATFORM_SERVO_OFF]
gcode:
  SET_SERVO SERVO=purge_platform WIDTH=0

[gcode_macro WIPE_NOZZLE]
gcode:
  G90
  ; Go to Wipe start pos
  G1 X175 Y248 F15000
  G1 F15000
  ; start wiping
  G1 X195 Y248
  G1 F5000
  G1 X210
  G1 X195
  G1 X210
  G1 X195
  G1 X210
  G1 X195
  G1 X210
  G1 X195
  G1 X210
  ; Finally wipe over the silicon brush
  G1 X192 Y243
  G1 X190 Y248
  G1 X188 Y243
  G1 X186 Y248
  G1 X184 Y243
  G1 X182 Y248
  G1 X214
  ; Go to wipe end pos
  ; G1 Y200 F15000

; Called by the MMU after an endless spool tool change, before the print
; resumes. Moves the toolhead over the purge platform (in case PAUSE parked it
; somewhere else), purges the rest of the old filament and some of the new one
; onto the platform (the start of the flush in change_filament.gcode),
; retracts the platform so the blob breaks off, wipes the nozzle and extends
; the platform again. The extrusion mode, E position and part fan speed of the
; print are restored.
[gcode_macro _MMU_ENDLESS_SPOOL_POST_LOAD]
gcode:
  {% set fan_speed = printer.fan.speed %}
  SAVE_GCODE_STATE NAME=_MMU_ENDLESS_SPOOL_POST_LOAD
  G90
  G1 X214 Y248 F15000 ; the purge position over the platform, same as the park position
  M83
  ; stop fans so that the first bit of filament lands in to the platform
  M106 S0
  G1 E23.7 F486 ; do not need pulsatile flushing for start part
  G1 E0.5 F50
  G1 E6.0 F486
  ; now start the fans so that the blob gets cooled down
  M106 S64
  G1 E0.5 F50
  G1 E6.0 F486
  G1 E0.5 F50
  G1 E6.0 F486
  G1 E0.5 F50
  G1 E6.0 F486
  M106 S255
  PURGE_PLATFORM_RETRACT
  G1 E-1.5 F1800 ; retract before wiping
  M400
  WIPE_NOZZLE
  G1 E1 F1800 ; de-retract after wiping
  PURGE_PLATFORM_EXTEND
  M106 S{(fan_speed * 255) | round | int}
  RESTORE_GCODE_STATE NAME=_MMU_ENDLESS_SPOOL_POST_LOAD


